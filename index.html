<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerenciador de Cardápio</title>
    <script defer type="module" src="main.js"></script>

    <!-- Importando o CSS do Bootstrap via CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
              <h4 class="mb-0">Cadastrar Novo Produto</h4>
            </div>
            <div class="card-body">
              <form id="formProduto">
                <div class="mb-3">
                  <label for="nomeProduto" class="form-label"
                    >Nome do Produto</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="nomeProduto"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="tipoProduto" class="form-label">Categoria</label>
                  <!-- Usamos form-select do Bootstrap para o estilo de dropdown -->
                  <select class="form-select" id="tipoProduto" required>
                    <option value="" selected disabled>
                      Escolha uma categoria...
                    </option>
                    <option value="Lanches">Lanches</option>
                    <option value="Pratos Executivos">Pratos Executivos</option>
                    <option value="Saladas">Saladas</option>
                    <option value="Petiscos">Petiscos</option>
                    <option value="Bebidas">Bebidas</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label for="precoProduto" class="form-label"
                    >Preço</label
                  >
                  <input
                    type="text"
                    /* step="0.01" */
                    class="form-control"
                    id="precoProduto"
                    placeholder="R$"
                    required
                  />
                </div>
                <div class="input-group">
                  <input
                    type="file"
                    class="form-control"
                    id="inputGroupFile04"
                    aria-describedby="inputGroupFileAddon04"
                    aria-label="Upload"
                  />
                  <button
                    class="btn btn-outline-secondary"
                    type="button"
                    id="inputGroupFileAddon04"
                  >
                    Salvar
                  </button>
                </div>
                <button type="submit" class="btn btn-success w-100">
                  Cadastrar Produto
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Lembra do nosso ajuste? Aqui está o type="module" -->
  </body>
</html>
