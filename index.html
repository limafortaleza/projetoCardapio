<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerenciador de Cardápio</title>

    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
  font-family: "Inter", sans-serif;
  /* background-color: #1a4280; */
  background-image: linear-gradient(135deg, #3d6197 0%, #042453 100%);
}
.card-modern {
  border: none;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
}
.card-header-modern {
  background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
  color: white;
  border-radius: 16px 16px 0 0 !important;
  padding: 1.5rem;
  border-bottom: none;
}
.btn-modern {
  padding: 0.8rem;
  font-weight: 600;
  border-radius: 8px;
  transition:
    transform 0.2s,
    box-shadow 0.2s;
}
.btn-modern:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 15px rgba(25, 135, 84, 0.3);
}
.form-control:focus,
.form-select:focus {
  box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
  border-color: #86b7fe;
}

#resultado .card {
  width: 22rem;
  border-radius: 16px;
  overflow: hidden;
}

#resultado .card img {
  width: 100%;
  height: 250px;
  object-fit: cover;
}
/* ===================================================== */
    </style>>
  <body>
    <!-- Seção do Formulário -->
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="card card-modern">
            <div class="card-header card-header-modern text-center">
              <h4 class="mb-0 fw-bold">
                <i class="bi bi-journal-plus me-2"></i>Cadastrar Produto
              </h4>
            </div>

            <div class="card-body p-4 p-md-5">
              <form id="formProduto">
                <!-- Nome do Produto -->
                <div class="form-floating mb-3">
                  <input
                    type="text"
                    class="form-control"
                    id="nomeProduto"
                    placeholder="Nome do Produto"
                    required
                  />
                  <label for="nomeProduto"
                    ><i class="bi bi-box-seam me-1 text-muted"></i> Nome do
                    Produto</label
                  >
                </div>

                <!-- Descrição -->
                <div class="form-floating mb-3">
                  <textarea
                    class="form-control"
                    id="descricao"
                    placeholder="Descrição do Produto"
                    style="height: 100px"
                    required
                  ></textarea>
                  <label for="descricao"
                    ><i class="bi bi-card-text me-1 text-muted"></i>
                    Descrição</label
                  >
                </div>

                <div class="row g-3 mb-3">
                  <!-- Categoria -->
                  <div class="col-md-7">
                    <div class="form-floating">
                      <select
                        class="form-select"
                        id="tipoProduto"
                        aria-label="Categoria do Produto"
                        required
                      >
                        <option value="" selected disabled>
                          Escolha uma categoria...
                        </option>
                        <option value="Lanches">Lanches</option>
                        <option value="Pratos">
                          Pratos Executivos
                        </option>
                        <option value="Bebidas">Bebidas</option>
                      </select>
                      <label for="tipoProduto"
                        ><i class="bi bi-tags me-1 text-muted"></i>
                        Categoria</label
                      >
                    </div>
                  </div>

                  <!-- Preço -->
                  <div class="col-md-5">
                    <div class="form-floating">
                      <input
                        type="number"
                        step="0.01"
                        class="form-control"
                        id="precoProduto"
                        placeholder="R$"
                        required
                      />
                      <label for="precoProduto"
                        ><i class="bi bi-currency-dollar me-1 text-muted"></i>
                        Preço (R$)</label
                      >
                    </div>
                  </div>
                </div>

                <div class="form-floating mb-4">
                  <input
                    type="url"
                    class="form-control"
                    id="urlDaImagem"
                    placeholder="URL da imagem"
                  />
                  <label for="urlDaImagem"
                    ><i class="bi bi-image me-1 text-muted"></i> Link da Imagem
                    (URL)</label
                  >
                </div>

                <button
                  type="submit"
                  class="btn btn-success btn-modern w-100 mt-2"
                >
                  <i class="bi bi-check2-circle me-2"></i> Cadastrar
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="container mb-4">
      <div class="card card-modern">
        <div class="card-header card-header-modern">
          <h5 class="mb-0">
            <i class="bi bi-cash-coin me-2"></i>
            Resumo de Vendas
          </h5>
        </div>

        <div class="card-body py-4">
          <div class="row text-center">

            <!-- Venda Atual -->
            <div class="col-md-6 border-end">
              <i class="bi bi-receipt-cutoff text-primary fs-1"></i>
              <h6 class="text-muted mt-2">Total da Venda</h6>
              <h2
                id="venda-atual"
                class="fw-bold text-primary mb-0"
              >
               R$ 0,00
               
              </h2>
            </div>

            <!-- Total Geral -->
            <div class="col-md-6">
              <i class="bi bi-graph-up-arrow text-success fs-1"></i>
              <h6 class="text-muted mt-2">Total Geral de Vendas</h6>
              <h2
                id="total-geral-vendas"
                class="fw-bold text-success mb-0"
              >
               R$ 0,00
                
              </h2>
            </div>

          </div>
        </div>
      </div>
    </div>

    
    <div class="container pb-5">
      <div
        class="d-flex flex-wrap justify-content-center gap-4 text-center"
        id="resultado"

        /* meus cards */
      ></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
