<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerenciador de Cardápio</title>

    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <script defer type="module" src="main.js"></script>

    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #f8f9fa;
      }
      .card-modern {
        border: none;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      }
      .card-header-modern {
        background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
        color: white;
        border-radius: 16px 16px 0 0 !important;
        padding: 1.5rem;
        border-bottom: none;
      }
      .btn-modern {
        padding: 0.8rem;
        font-weight: 600;
        border-radius: 8px;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .btn-modern:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(25, 135, 84, 0.3);
      }
      .form-control:focus,
      .form-select:focus {
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        border-color: #86b7fe;
      }
    </style>
  </head>
  <body>
    <!-- Seção do Formulário -->
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="card card-modern">
            <div class="card-header card-header-modern text-center">
              <h4 class="mb-0 fw-bold">
                <i class="bi bi-journal-plus me-2"></i>Cadastrar Prato
              </h4>
            </div>

            <div class="card-body p-4 p-md-5">
              <form id="formProduto">
                <!-- Nome do Produto -->
                <div class="form-floating mb-3">
                  <input
                    type="text"
                    class="form-control"
                    id="nomeProduto"
                    placeholder="Nome do Produto"
                    required
                  />
                  <label for="nomeProduto"
                    ><i class="bi bi-box-seam me-1 text-muted"></i> Nome do
                    Produto</label
                  >
                </div>

                <!-- Descrição -->
                <div class="form-floating mb-3">
                  <textarea
                    class="form-control"
                    id="descricao"
                    placeholder="Descrição do Produto"
                    style="height: 100px"
                    required
                  ></textarea>
                  <label for="descricao"
                    ><i class="bi bi-card-text me-1 text-muted"></i>
                    Descrição</label
                  >
                </div>

                <div class="row g-3 mb-3">
                  <!-- Categoria -->
                  <div class="col-md-7">
                    <div class="form-floating">
                      <select
                        class="form-select"
                        id="tipoProduto"
                        aria-label="Categoria do Produto"
                        required
                      >
                        <option value="" selected disabled>
                          Escolha uma categoria...
                        </option>
                        <option value="Lanches">Lanches</option>
                        <option value="Pratos Executivos">
                          Pratos Executivos
                        </option>
                        <option value="Bebidas">Bebidas</option>
                      </select>
                      <label for="tipoProduto"
                        ><i class="bi bi-tags me-1 text-muted"></i>
                        Categoria</label
                      >
                    </div>
                  </div>

                  <!-- Preço -->
                  <div class="col-md-5">
                    <div class="form-floating">
                      <input
                        type="number"
                        step="0.01"
                        class="form-control"
                        id="precoProduto"
                        placeholder="R$"
                        required
                      />
                      <label for="precoProduto"
                        ><i class="bi bi-currency-dollar me-1 text-muted"></i>
                        Preço (R$)</label
                      >
                    </div>
                  </div>
                </div>

                <div class="form-floating mb-4">
                  <input
                    type="url"
                    class="form-control"
                    id="urlDaImagem"
                    placeholder="URL da imagem"
                  />
                  <label for="urlDaImagem"
                    ><i class="bi bi-image me-1 text-muted"></i> Link da Imagem
                    (URL)</label
                  >
                </div>

                <button
                  type="submit"
                  class="btn btn-success btn-modern w-100 mt-2"
                >
                  <i class="bi bi-check2-circle me-2"></i> Cadastrar Produto
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="container pb-5">
      <div
        class="d-flex flex-wrap justify-content-center gap-4 text-center"
        id="resultado"

        /* meus cards */
      ></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
